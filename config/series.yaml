# 한국 GDP 나우 — 시계열 정의
# 모든 코드는 2026-10-11 ECOS 메타데이터 API로 확인함.
# items: ECOS StatisticSearch의 ITEM_CODE1/2/3 순서

target:
  key: gdp
  label: 실질 GDP (계절조정, 전기비)
  stat: "200Y102"      # 2.1.1.2. 주요지표(분기지표)
  cycle: Q
  items: ["10111"]     # 국내총생산(GDP)(실질, 계절조정, 전기비), %
  start: 2000Q1

# 브리지 방정식에 들어가는 월간 지표 (계절조정 수준 지수)
bridge:
  ip:
    label: 광공업
    stat: "901Y033"    # 8.1.4. 전산업생산지수(농림어업제외)
    items: [AB00, "2"] # 광공업 / 계절조정
    source: 통계청 산업활동동향
  sv:
    label: 서비스업
    stat: "901Y033"
    items: [AC00, "2"]
    source: 통계청 산업활동동향
  cn:
    label: 건설업
    stat: "901Y033"
    items: [AD00, "2"] # 건설업 생산(건설기성 불변) / 계절조정
    source: 통계청 산업활동동향
  pa:
    label: 공공행정
    stat: "901Y033"
    items: [AE00, "2"]
    source: 통계청 산업활동동향
  ex:
    label: 실질수출
    stat: "403Y002"    # 3.3.1.1.2. 수출물량지수 (원계열 → 자체 계절·영업일 조정)
    items: ["*AA"]
    seasonal_adjust: true
    customs_flash: true   # 관세청 10일·20일·월 속보로 미발표 월 보강
    source: 한은 수출물량지수 + 관세청 속보

# 보조 지표 (모형 보간·표시용)
aux:
  esi:
    label: 경제심리지수
    stat: "513Y001"
    items: [E1000]
  xp_usd:
    label: 수출물가(달러기준)
    stat: "402Y014"
    items: ["*AA", D]
  chip_vol:
    label: 반도체 수출물량
    stat: "403Y002"
    items: ["3091AA"]
  chip_px:
    label: 반도체 수출물가(달러)
    stat: "402Y014"
    items: ["3091AA", D]
  all_ind:
    label: 전산업생산
    stat: "901Y033"
    items: [A00, "2"]

# 경상성장률용: 명목 GDP(계절조정 전기비) → 디플레이터 = (1+명목)/(1+실질) − 1
nominal:
  label: 명목 GDP (계절조정, 전기비)
  stat: "200Y102"
  items: ["60111"]     # 국내총생산(GDP)(명목, 계절조정, 전기비), 2010Q2~
  start: 2010Q2

# GDP 디플레이터 브리지: 국내 물가 + 교역조건(수출·수입물가, 원화)
deflator:
  bridge_start: 2010Q3
  bridge:
    cpi:
      label: 소비자물가
      stat: "901Y009"  # 4.2.1. 소비자물가지수
      items: ["0"]     # 총지수
      seasonal_adjust: true
      source: 통계청
    px:
      label: 수출물가(원화)
      stat: "402Y014"
      items: ["*AA", W]
      source: 한국은행
    pm:
      label: 수입물가(원화)
      stat: "401Y015"  # 4.3.2.1. 수입물가지수(기본분류)
      items: ["*AA", W]
      source: 한국은행

# ── 부가 분석 (헤드라인과 별개, 실패해도 본 추정은 계속) ─────────────────
extras:
  # ❹ 실질 GNI·교역조건 / ❺ 분배: 200Y102 원계열 전년동기비(%)
  income:
    stat: "200Y102"
    start: 2011Q1
    items:
      gdp_r: "10211"     # 실질 GDP
      gni_r: "20122"     # 실질 GNI
      gdp_n: "60211"     # 명목 GDP
      comp: "60212"      # 피용자보수
      surplus: "60213"   # 총영업잉여
      tax: "60214"       # 순생산 및 수입세
  # ❺ 소득별 비중(가중치): 200Y113 국내총생산과 지출(명목, 연간), 십억원
  dist_weights:
    stat: "200Y113"
    start: "2010"
    items: {gdp: "10106", comp: "10101", os: "10102", cfc: "10103", tax: "10104", sub: "10105"}
  # ❺-2 노동소득분배율(피용자보수 비율) = 피용자보수 ÷ 요소비용국민소득: 200Y116 국민소득(명목, 연간)
  labor_share:
    stat: "200Y116"
    start: "2010"
    items: {ni: "10301", comp: "10101", kp: "10201"}
  # ❻ 지출 측: 200Y108 국내총생산에 대한 지출(계절조정, 실질), 십억원
  expenditure:
    stat: "200Y108"
    start: 2005Q1
    items:
      pc:  {code: "1010110", label: 민간소비}
      gc:  {code: "1010120", label: 정부소비}
      ci:  {code: "1020111", label: 건설투자}
      ei:  {code: "1020112", label: 설비투자}
      ipp: {code: "1020113", label: 지식재산투자}
      inv: {code: "1020120", label: 재고증감}
      x:   {code: "10301",   label: 수출}
      m:   {code: "10401",   label: 수입}
      sd:  {code: "10501",   label: 통계상 불일치}
      gdp: {code: "10601",   label: GDP}
  # 지출 항목별 브리지에 쓰는 월간 지표 (생산 측 지표 + 추가 2개)
  exp_monthly:
    eq:
      label: 설비투자지수
      stat: "901Y066"    # 8.1.3. 설비투자지수
      items: [I15B]      # 계절조정지수
    mv:
      label: 수입물량
      stat: "403Y004"    # 3.3.1.2.2. 수입물량지수
      items: ["*AA"]
      seasonal_adjust: true
  exp_bridge:            # 지출 항목 ← 월간 지표
    pc: sv               # 민간소비 ← 서비스업생산
    gc: pa               # 정부소비 ← 공공행정
    ci: cn               # 건설투자 ← 건설업생산
    ei: eq               # 설비투자 ← 설비투자지수
    x: ex                # 수출 ← 실질수출
    m: mv                # 수입 ← 수입물량

monthly_start: "200001"

model:
  bridge_start: 2006Q1
  exclude_quarters: [2020Q1, 2020Q2, 2020Q3, 2020Q4]   # 코로나 충격 분기
  exclude_months_from: "2020-02"
  exclude_months_to: "2020-12"
  ar_lags: 2
  ar_start: "2011-01"
  backtest_start: 2015Q1

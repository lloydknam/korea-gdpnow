<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소득자산 분석 · 실험실</title>
<meta name="description" content="연령대별 가구 소득·자산 변화 갭마인더 — Korea GDP Now 실험실">
<meta name="theme-color" content="#f4f1eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191c" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light;--bg:#f4f1eb;--rule:#d9d4ca;--ink:#14181d;--ink-2:#4a4f55;--ink-3:#7c8086;--grid:#e2ddd3;--axis:#b5afa4;--head:#0f4c75;--main:#135f8c;--chip:#ece8e0}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#16191c;--rule:#2f3439;--ink:#eef0f2;--ink-2:#b8bdc3;--ink-3:#868b91;--grid:#262a2f;--axis:#454b52;--head:#8cc4ea;--main:#5aa9db;--chip:#23272b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
a.back{font-size:13px;color:var(--ink-2);text-decoration:none}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:10px 0 4px;color:var(--head)}
.sub{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.empty{border:1px dashed var(--axis);padding:28px 18px;text-align:center;color:var(--ink-2);font-size:14px;margin-top:12px}
.empty b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:12px;margin:8px 0 6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:700;background:var(--chip);color:var(--ink);border:1px solid var(--rule);padding:6px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.yr{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:4.2ch}
input[type=range]{flex:1;min-width:160px;accent-color:var(--main)}
svg{display:block;width:100%;height:auto;overflow:visible;margin-top:6px}
svg text{fill:var(--ink-3);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.foot{font-size:12px;color:var(--ink-3);margin-top:16px;line-height:1.6;border-top:1px solid var(--rule);padding-top:10px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:4px;opacity:0;transition:opacity .1s;white-space:nowrap}
.wrap{position:relative}
</style>
</head>
<body>
<main>
  <a class="back" href="../../">← Korea GDP Now</a>
  <h1>소득자산 분석</h1>
  <p class="sub">연령계층별 가구 평균 소득·자산의 변화 · 버블 크기 = 가구 비중</p>

  <div id="root"></div>

  <div class="foot" id="foot"></div>
</main>
<div class="tip" id="tip"></div>

<script>
const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const PALETTE = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#8a63d2","#9c6b3f","#8a9a2b","#22a6b8","#3f51b5","#c2185b","#607d8b"];
const DARK_PALETTE = ["#3987e5","#d95926","#199e70","#c98500","#d55181","#9a78e6","#b78452","#a3b23a","#2ab8cb","#7986cb","#e05a8a","#90a4ae"];
const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.getAttribute("data-theme") !== "light";
const colorOf = (i) => (isDark() ? DARK_PALETTE : PALETTE)[i % PALETTE.length];
const fmtMan = (v) => v == null ? "–" : (v >= 10000 ? (v / 10000).toFixed(1) + "억" : Math.round(v).toLocaleString("ko-KR") + "만");

const el = (tag, attrs = {}, parent) => {
  const n = tag.startsWith("svg") || ["circle","line","text","g","rect","path"].includes(tag)
    ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};

fetch("data.json", { cache: "no-store" })
  .then((r) => r.json())
  .then(init)
  .catch(() => { $("#root").innerHTML = '<div class="empty"><b>데이터를 불러오지 못했습니다.</b></div>'; });

function init(D) {
  $("#foot").textContent = `${D.source || ""}${D.unit ? " · 단위: " + D.unit : ""}${D.note ? " · " + D.note : ""}`;
  const groups = (D.groups || []).filter((g) => g.data && Object.keys(g.data).length);
  const years = (D.years && D.years.length ? D.years : [...new Set(groups.flatMap((g) => Object.keys(g.data)))].map(Number)).sort((a, b) => a - b);

  if (!groups.length || !years.length) {
    $("#root").innerHTML = '<div class="empty"><b>데이터 대기 중</b><br>가계금융복지조사 연령 5세 구간 시계열을 <code>data.json</code>에 채우면 차트가 나타납니다.</div>';
    return;
  }
  render(D, groups, years);
}

function render(D, groups, years) {
  const root = $("#root");
  root.innerHTML = "";
  const W = 720, H = 440, M = { l: 62, r: 16, t: 14, b: 40 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;

  const xs = groups.flatMap((g) => Object.values(g.data).map((d) => d.income)).filter((v) => v != null);
  const ys = groups.flatMap((g) => Object.values(g.data).map((d) => d.asset)).filter((v) => v != null);
  const hh = groups.flatMap((g) => Object.values(g.data).map((d) => d.households)).filter((v) => v != null);
  const xMax = Math.max(...xs) * 1.08, yMax = Math.max(...ys) * 1.08;
  const hMax = Math.max(...hh, 1);
  const X = (v) => M.l + (v / xMax) * pw;
  const Y = (v) => M.t + ph - (v / yMax) * ph;
  const R = (h) => h == null ? 0 : 6 + 26 * Math.sqrt(h / hMax);

  const wrap = el("div", { class: "wrap" }, root);
  const bar = el("div", { class: "bar" }, wrap);
  const play = el("button", { type: "button", "aria-label": "재생" }, bar);
  play.textContent = "▶ 재생";
  const yr = el("div", { class: "yr", "aria-live": "polite" }, bar);
  const rng = el("input", { type: "range", min: 0, max: years.length - 1, step: 1, "aria-label": "연도" }, bar);
  rng.value = years.length - 1;

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "연령대별 소득·자산 버블차트" }, wrap);
  const gGrid = el("g", {}, svg), gAxis = el("g", {}, svg), gBubbles = el("g", {}, svg);
  const yTicks = 5, xTicks = 6;
  for (let i = 0; i <= yTicks; i++) {
    const v = (yMax / yTicks) * i, y = Y(v);
    el("line", { x1: M.l, x2: W - M.r, y1: y, y2: y, stroke: "var(--grid)" }, gGrid);
    const t = el("text", { x: M.l - 8, y: y + 4, "text-anchor": "end" }, gAxis); t.textContent = fmtMan(v);
  }
  for (let i = 0; i <= xTicks; i++) {
    const v = (xMax / xTicks) * i, x = X(v);
    el("line", { x1: x, x2: x, y1: M.t, y2: M.t + ph, stroke: "var(--grid)" }, gGrid);
    const t = el("text", { x, y: H - 16, "text-anchor": "middle" }, gAxis); t.textContent = fmtMan(v);
  }
  const xl = el("text", { x: M.l + pw / 2, y: H - 2, "text-anchor": "middle" }, gAxis); xl.textContent = "평균 소득 →";
  const yl = el("text", { x: 0, y: 0, transform: `translate(14 ${M.t + ph / 2}) rotate(-90)`, "text-anchor": "middle" }, gAxis); yl.textContent = "평균 자산 →";

  const legend = el("div", { class: "legend" }, wrap);
  groups.forEach((g, i) => {
    const item = el("span", {}, legend);
    const dot = el("i", {}, item); dot.style.background = colorOf(i);
    item.appendChild(document.createTextNode(g.label));
  });

  const tip = $("#tip");
  const circles = groups.map((g, i) => {
    const c = el("circle", { r: 0, fill: colorOf(i), "fill-opacity": 0.72, stroke: colorOf(i), "stroke-width": 1 }, gBubbles);
    c.style.cursor = "pointer";
    c.addEventListener("mouseenter", () => showTip(g, cur, c));
    c.addEventListener("mouseleave", () => (tip.style.opacity = 0));
    c.addEventListener("click", () => showTip(g, cur, c));
    return c;
  });

  let cur = years.length - 1;
  function showTip(g, idx, c) {
    const d = g.data[years[idx]];
    if (!d) { tip.style.opacity = 0; return; }
    tip.innerHTML = `<b>${g.label}</b> · ${years[idx]}<br>소득 ${fmtMan(d.income)} · 자산 ${fmtMan(d.asset)}${d.households != null ? "<br>가구 비중 " + d.households.toFixed(1) + "%" : ""}`;
    const box = svg.getBoundingClientRect(), wrapBox = wrap.getBoundingClientRect();
    const sx = box.width / W;
    tip.style.left = (box.left - wrapBox.left + X(d.income) * sx + 10) + "px";
    tip.style.top = (box.top - wrapBox.top + Y(d.asset) * sx - 10) + "px";
    tip.style.opacity = 1;
  }

  function draw(idx) {
    cur = idx;
    const y = years[idx];
    yr.textContent = y;
    rng.value = idx;
    groups.forEach((g, i) => {
      const d = g.data[y];
      const c = circles[i];
      if (!d || d.income == null || d.asset == null) { c.setAttribute("r", 0); return; }
      c.setAttribute("cx", X(d.income));
      c.setAttribute("cy", Y(d.asset));
      c.setAttribute("r", R(d.households));
    });
  }

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; play.textContent = "▶ 재생"; };
  const start = () => {
    if (cur >= years.length - 1) draw(0);
    play.textContent = "⏸ 일시정지";
    timer = setInterval(() => {
      if (cur >= years.length - 1) { draw(0); return; }
      draw(cur + 1);
    }, 900);
  };
  play.addEventListener("click", () => (timer ? stop() : start()));
  rng.addEventListener("input", () => { stop(); draw(+rng.value); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { stop(); draw(Math.max(0, cur - 1)); }
    if (e.key === "ArrowRight") { stop(); draw(Math.min(years.length - 1, cur + 1)); }
  });

  draw(cur);
}
</script>
</body>
</html>
